plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jarvis.batterysaver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jarvis.batterysaver'
        minSdk 29
        targetSdk 33
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
}
