<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030b16;color:#d9f7ff;font-family:Arial,sans-serif}
header{text-align:center;padding:24px 12px 12px}
h1{font-size:29px;letter-spacing:7px;color:#35cfff;text-shadow:0 0 15px #008cff}
.status{color:#45e5b0;font-size:12px;letter-spacing:2px}
.arc{width:116px;height:116px;border:3px solid #19baff;border-radius:50%;margin:18px auto;display:grid;place-items:center;box-shadow:0 0 22px #007bff,inset 0 0 20px #007bff}
.arc div{width:76px;height:76px;border:3px solid #8ceaff;border-radius:50%;box-shadow:0 0 20px #00bfff}
main{padding:12px;max-width:650px;margin:auto}
.panel{background:#071827;border:1px solid #12618a;border-radius:13px;padding:14px;margin-bottom:13px}
input,textarea{width:100%;background:#020b14;border:1px solid #155477;border-radius:8px;padding:12px;color:white;margin:6px 0}
button{background:#087eb8;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:bold;margin:5px 3px}
button:active{background:#00aaff}
#chat{height:270px;overflow:auto;white-space:pre-wrap;line-height:1.5;font-size:14px}
.user{color:#64d9ff;margin:10px 0}
.bot{color:#d8f5ff;margin:10px 0}
.small{font-size:11px;color:#8aa9bd}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0}
</style>
</head>
<body>
<header>
<h1>J.A.R.V.I.S.</h1>
<div class="status">● SYSTEM ONLINE</div>
<div class="arc"><div></div></div>
<div class="small">PERSONAL AI ASSISTANT</div>
</header>
<main>
<section class="panel">
<b>GEMINI CONNECTION</b>
<input id="apiKey" type="password" placeholder="Enter your Gemini API key">
<button onclick="saveKey()">SAVE API KEY</button>
<div class="small">Your key is stored on this device. Do not share it.</div>
</section>
<section class="panel">
<b>CONVERSATION</b>
<div id="chat"><div class="bot">JARVIS: Good day, Sir. Systems are online. How may I assist you?</div></div>
<div class="row">
<input id="message" placeholder="Ask JARVIS anything..." onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">SEND</button>
</div>
<button onclick="clearChat()">CLEAR CHAT</button>
</section>
</main>
<script>
const chat=document.getElementById('chat');
function addMessage(type,text){
 const div=document.createElement('div');
 div.className=type;
 div.textContent=(type==='user'?'YOU: ':'JARVIS: ')+text;
 chat.appendChild(div);chat.scrollTop=chat.scrollHeight;
}
function saveKey(){
 const key=document.getElementById('apiKey').value.trim();
 if(!key){alert('Please enter your API key.');return;}
 localStorage.setItem('jarvis_api_key',key);
 document.getElementById('apiKey').value='';
 alert('API key saved on this device.');
}
async function sendMessage(){
 const input=document.getElementById('message');
 const prompt=input.value.trim();
 if(!prompt)return;
 const key=localStorage.getItem('jarvis_api_key');
 if(!key){alert('Please enter and save your Gemini API key first.');return;}
 input.value='';
 addMessage('user',prompt);
 const wait=document.createElement('div');
 wait.className='bot';wait.textContent='JARVIS: Processing, Sir...';chat.appendChild(wait);
 chat.scrollTop=chat.scrollHeight;
 try{
  const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({system_instruction:{parts:[{text:'You are JARVIS, a polite, intelligent personal AI assistant. Address the user as Sir. Reply clearly.'}]},contents:[{parts:[{text:prompt}]}]})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error?.message||'API request failed');
  const answer=data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('\n')||'No response received.';
  wait.textContent='JARVIS: '+answer;
 }catch(e){wait.textContent='JARVIS: Sorry, Sir. '+e.message;}
 chat.scrollTop=chat.scrollHeight;
}
function clearChat(){
 chat.innerHTML='<div class="bot">JARVIS: Conversation cleared, Sir.</div>';
}
</script>
</body>
</html>
